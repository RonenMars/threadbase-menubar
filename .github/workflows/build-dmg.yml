name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Cancel in-flight runs on the same ref when a newer commit lands.
concurrency:
  group: build-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign, notarize
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write  # needed for the "latest-main" prerelease step

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up signing keychain
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          # Decode the .p12 cert from the base64 secret.
          echo -n "$APPLE_CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          # Create a temporary keychain, unlock it, and disable auto-lock so the
          # whole build can use it without re-entering the password.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the cert and grant codesign access without an interactive
          # prompt (-T /usr/bin/codesign + set-key-partition-list).
          security import "$CERT_PATH" \
            -P "$APPLE_CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make the temp keychain the default search path so electron-builder
          # finds the identity. The login keychain on GH runners is empty, but
          # we put ours first defensively.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KEYCHAIN_PATH"

          # Sanity check — fail early if the cert didn't land.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          # Surface only the path to subsequent steps — never the contents.
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build signed + notarized universal DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # APPLE_API_KEY is set in the previous step via $GITHUB_ENV.
        run: npm run package:mac

      - name: Verify signature and notarization
        run: |
          set -euo pipefail
          APP="release/mac-universal/Threadbase Menubar.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Threadbase-Menubar-dmg
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish to rolling "latest-main" prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="latest-main"
          SHORT_SHA="$(git rev-parse --short "$COMMIT_SHA")"
          TITLE="Latest main build ($SHORT_SHA)"
          NOTES="Rolling build from $COMMIT_SHA. Replaced on every push to main — for stable downloads, use a tagged release."

          # Delete the old release+tag if they exist, then recreate. We keep the
          # release as a *prerelease* so semver tooling and the public Releases
          # page don't treat it as the current stable version.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" release/*.dmg \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease \
            --target "$COMMIT_SHA"

      - name: Publish stable release for version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only create the release if it doesn't already exist. semantic-release
          # (or any other tagger) may have already created an empty release —
          # in that case we just upload the DMG to it.
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists — uploading DMG to it"
            gh release upload "$TAG_NAME" release/*.dmg --clobber
          else
            echo "Creating new release $TAG_NAME"
            gh release create "$TAG_NAME" release/*.dmg \
              --title "$TAG_NAME" \
              --generate-notes
          fi

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # needed for publishing to releases

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage (x64)
        run: npm run package:linux

      - name: Upload AppImage as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Threadbase-Menubar-appimage
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Publish to rolling "latest-main" prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="latest-main"
          # The macOS job recreates this release on every main push. We just
          # upload our AppImages to it; --clobber handles re-runs idempotently.
          # If the macOS job hasn't created the release yet, wait briefly and
          # retry — both jobs run in parallel.
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" release/*.AppImage --clobber
              exit 0
            fi
            echo "Release $TAG not yet present (attempt $i); sleeping 10s"
            sleep 10
          done
          echo "error: $TAG release was never created by the macOS job" >&2
          exit 1

      - name: Publish stable release for version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The macOS job may or may not have created the release yet — both
          # jobs run in parallel. Retry briefly, then create if absent.
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" release/*.AppImage --clobber
              exit 0
            fi
            echo "Release $TAG_NAME not yet present (attempt $i); sleeping 10s"
            sleep 10
          done
          # Macos job hasn't created it (maybe failed/slow). Create here.
          echo "Creating new release $TAG_NAME from linux job"
          gh release create "$TAG_NAME" release/*.AppImage \
            --title "$TAG_NAME" \
            --generate-notes
