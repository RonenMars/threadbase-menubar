name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.claude/**'
      - '.remember/**'
      - '.gitignore'
      - '.vscode/**'
      - '.idea/**'
      - 'coverage/**'
      - 'test/**'
      - 'tests/**'
      - '__tests__/**'
      - 'playwright/**'
      - '**/*.spec.ts'
      - '**/*.test.ts'
      - '.eslintrc*'
      - '.prettierrc*'
      - 'commitlint.config.*'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/dependabot.yml'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.claude/**'
      - '.remember/**'
      - '.gitignore'
      - '.vscode/**'
      - '.idea/**'
      - 'coverage/**'
      - 'test/**'
      - 'tests/**'
      - '__tests__/**'
      - 'playwright/**'
      - '**/*.spec.ts'
      - '**/*.test.ts'
      - '.eslintrc*'
      - '.prettierrc*'
      - 'commitlint.config.*'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/dependabot.yml'

# Cancel in-flight runs on the same ref when a newer commit lands.
concurrency:
  group: build-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign, notarize
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write  # needed for the "latest-main" prerelease step

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up signing keychain
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          # Decode the .p12 cert from the base64 secret.
          echo -n "$APPLE_CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          # Create a temporary keychain, unlock it, and disable auto-lock so the
          # whole build can use it without re-entering the password.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the cert and grant codesign access without an interactive
          # prompt (-T /usr/bin/codesign + set-key-partition-list).
          security import "$CERT_PATH" \
            -P "$APPLE_CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make the temp keychain the default search path so electron-builder
          # finds the identity. The login keychain on GH runners is empty, but
          # we put ours first defensively.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KEYCHAIN_PATH"

          # Sanity check — fail early if the cert didn't land.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          # Surface only the path to subsequent steps — never the contents.
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build signed + notarized universal DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # APPLE_API_KEY is set in the previous step via $GITHUB_ENV.
        run: npm run package:mac

      - name: Verify signature and notarization
        run: |
          set -euo pipefail
          APP="release/mac-universal/Threadbase Menubar.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Threadbase-Menubar-dmg
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish to rolling "latest-main" prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="latest-main"
          SHORT_SHA="$(git rev-parse --short "$COMMIT_SHA")"
          TITLE="Latest main build ($SHORT_SHA)"
          NOTES="Rolling build from $COMMIT_SHA. Replaced on every push to main — for stable downloads, use a tagged release."

          # Additive publish: if the release exists, upload our DMG to it (so
          # parallel jobs' artefacts coexist). If absent, create with our DMG.
          # The previous delete-and-recreate approach wiped artefacts uploaded
          # by parallel linux/windows jobs.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.dmg --clobber
          else
            gh release create "$TAG" release/*.dmg \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              --target "$COMMIT_SHA"
          fi

      - name: Publish stable release for version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only create the release if it doesn't already exist. semantic-release
          # (or any other tagger) may have already created an empty release —
          # in that case we just upload the DMG to it.
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists — uploading DMG to it"
            gh release upload "$TAG_NAME" release/*.dmg --clobber
          else
            echo "Creating new release $TAG_NAME"
            gh release create "$TAG_NAME" release/*.dmg \
              --title "$TAG_NAME" \
              --generate-notes
          fi

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: build  # macOS job creates the release first; we upload to it
    timeout-minutes: 20
    permissions:
      contents: write  # needed for publishing to releases

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage (x64)
        # --publish never: electron-builder auto-detects CI and tries to
        # publish to GitHub, which fails without GH_TOKEN and would race
        # our explicit upload steps below. We publish explicitly.
        run: npm run package:linux -- --publish never

      - name: Upload AppImage as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Threadbase-Menubar-appimage
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Publish to rolling "latest-main" prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # macOS job (needs: build) has already created the release.
          # --clobber overwrites any same-name asset on re-runs.
          gh release upload "latest-main" release/*.AppImage --clobber

      - name: Publish stable release for version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # macOS job (needs: build) has already created the tagged release.
          gh release upload "$TAG_NAME" release/*.AppImage --clobber

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: build  # macOS job creates the release first; we upload to it
    timeout-minutes: 30
    permissions:
      contents: write  # needed for publishing to releases

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer (x64, unsigned)
        # --publish never: electron-builder auto-detects CI and tries to
        # publish to GitHub, which fails without GH_TOKEN and would race
        # our explicit upload step below.
        run: npm run package:win -- --publish never

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Threadbase-Menubar-exe
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish to rolling "latest-main" prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "latest-main" release/*.exe --clobber

      - name: Publish stable release for version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" release/*.exe --clobber
