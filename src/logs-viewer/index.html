<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src http://localhost:*;">
  <title>Threadbase Logs</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="logs-app">
    <div class="header">
      <span class="logo">⬡</span>
      <span class="title">Threadbase Logs</span>
      <div class="header-actions">
        <button id="refresh-btn" class="icon-btn" aria-label="Refresh" title="Refresh logs">↻</button>
        <button id="clear-btn" class="icon-btn" aria-label="Clear" title="Clear logs">🗑</button>
        <button id="close-btn" class="icon-btn" aria-label="Close">✕</button>
      </div>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="level-filter">Level:</label>
        <select id="level-filter">
          <option value="all">All</option>
          <option value="debug">Debug</option>
          <option value="info">Info</option>
          <option value="warn">Warn</option>
          <option value="error">Error</option>
        </select>
      </div>
      <div class="control-group">
        <label for="auto-scroll">
          <input type="checkbox" id="auto-scroll" checked>
          Auto-scroll
        </label>
      </div>
      <div class="control-group search-group">
        <label for="search-input">Search:</label>
        <div class="search-field">
          <input
            type="search"
            id="search-input"
            placeholder="Filter logs…"
            autocomplete="off"
            spellcheck="false"
            aria-label="Search logs"
          >
          <button type="button" id="search-clear" class="search-clear hidden" aria-label="Clear search" title="Clear search">✕</button>
        </div>
      </div>
      <div class="control-group">
        <label for="poll-interval">Interval:</label>
        <select id="poll-interval">
          <option value="1000">1s</option>
          <option value="2000" selected>2s</option>
          <option value="5000">5s</option>
          <option value="10000">10s</option>
          <option value="30000">30s</option>
          <option value="custom">Custom…</option>
        </select>
        <input
          type="number"
          id="custom-interval"
          class="custom-interval hidden"
          min="0.5"
          max="3600"
          step="0.5"
          value="2"
          title="Custom interval in seconds"
          aria-label="Custom interval in seconds"
        >
        <span id="custom-interval-unit" class="custom-interval-unit hidden">s</span>
      </div>
      <div class="control-group">
        <button type="button" id="load-older-btn" class="load-older-btn" title="Load older logs from the recent file window">Load older</button>
        <button type="button" id="load-all-btn" class="load-older-btn" title="Load all logs from the recent file window for searching">Load all</button>
        <span id="log-count" class="log-count">0 loaded</span>
      </div>
    </div>

    <div class="logs-container" id="logs-container">
      <div class="logs-placeholder" id="logs-placeholder">
        <span class="placeholder-icon">📋</span>
        <span class="placeholder-text">No logs yet. Waiting for data...</span>
      </div>
      <div class="virtual-list hidden" id="virtual-list">
        <div class="virtual-spacer" id="virtual-spacer">
          <div class="virtual-window" id="virtual-window"></div>
        </div>
      </div>
    </div>

    <div class="footer">
      <span id="status-text" class="status-text">Connecting...</span>
    </div>
  </div>

  <div id="load-all-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="load-all-modal-title">
    <div class="modal-backdrop" data-modal-dismiss="load-all"></div>
    <div class="modal-card">
      <h2 id="load-all-modal-title" class="modal-title">Load all logs?</h2>
      <p id="load-all-modal-body" class="modal-body"></p>
      <div class="modal-actions">
        <button type="button" id="load-all-cancel" class="modal-btn">Cancel</button>
        <button type="button" id="load-all-confirm" class="modal-btn modal-btn-primary">Load all</button>
      </div>
    </div>
  </div>

  <div id="log-detail-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="log-detail-title">
    <div class="modal-backdrop" data-modal-dismiss="log-detail"></div>
    <div class="modal-card modal-card-wide">
      <div class="modal-header">
        <h2 id="log-detail-title" class="modal-title">Log details</h2>
        <button type="button" id="log-detail-close" class="icon-btn" aria-label="Close details">✕</button>
      </div>
      <div id="log-detail-meta" class="log-detail-meta"></div>
      <pre id="log-detail-message" class="log-detail-message"></pre>
      <pre id="log-detail-extras" class="log-detail-extras hidden"></pre>
      <div class="modal-actions">
        <button type="button" id="log-detail-copy" class="modal-btn">Copy</button>
        <button type="button" id="log-detail-done" class="modal-btn modal-btn-primary">Close</button>
      </div>
    </div>
  </div>
  <script src="logs-viewer.js"></script>
</body>
</html>
